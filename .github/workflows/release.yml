name: GazeAlert Release Publisher

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish Official Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies & Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install Inno Setup
      run: |
        choco install innosetup -y

    - name: Build Standalone Installer
      shell: cmd
      run: |
        build_installer.bat < nul

    - name: Create GitHub Release & Upload Installer
      uses: softprops/action-gh-release@v2
      with:
        files: Output/GazeAlert_Setup_v2.0.exe
        name: GazeAlert AI Studio ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          ## 🚀 GazeAlert AI Studio ${{ github.ref_name }} - Standalone Windows Release

          ### 📦 Pachet de Instalare Automat (1-Click Installer):
          - **Fișier**: `GazeAlert_Setup_v2.0.exe` (~68 MB)
          - **Compatibilitate**: Windows 10 & Windows 11 (64-bit)
          - **Zero Dependințe**: Nu necesită instalare de Python, C++ sau alte pachete manuale. Include tot mediul necesar gata de rulare.

          ---

          ### ✨ Funcționalități Cheie:
          - 🎯 **Face Mesh Medical-Grade (478 Puncte)**: Urmărire sub-pixel a irisului (Algoritm Daugman + Angle Kappa).
          - 🧠 **Pupillometrie & Saccade Reading Tracker**: Analiză în timp real a efortului cognitiv și stării de lectură/flow.
          - ⏱️ **Timer Inteligent Pomodoro & Monk Mode**: Monitorizare a concentrării cu pauză automată la distrageri.
          - 📊 **Dashboard HTML Interactiv & Istoric SQLite**: Generare de hărți termice (Heatmap) și statistici zilnice de productivitate.
          - 🔔 **Alerte Sonore & Notificări Windows**: Feedback audio plăcut sintetizat și pictograme în System Tray.
